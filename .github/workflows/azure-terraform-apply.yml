name: Azure Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/modules/**"
      - "terraform/environments/azure/**"
      - "terraform/global/azure/**"

env:
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_STATE_RESOURCE_GROUP: idp-terraform-state-rg
  TF_STATE_STORAGE_ACCOUNT: idpterraformstate
  TF_STATE_CONTAINER: tfstate

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: "Terraform Apply - ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stage, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure/${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: terraform apply -auto-approve tfplan