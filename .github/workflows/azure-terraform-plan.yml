name: Azure Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/modules/**"
      - "terraform/environments/azure/**"
      - "terraform/global/azure/**"

env:
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_STATE_RESOURCE_GROUP: idp-terraform-state-rg
  TF_STATE_STORAGE_ACCOUNT: idpterraformstate
  TF_STATE_CONTAINER: tfstate

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: "Terraform Plan - ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stage, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: terraform fmt -check || echo "::warning::Terraform formatting issues found"

      - name: Terraform Init
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure/${{ matrix.environment }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Infracost Setup
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Breakdown
        id: infracost
        working-directory: terraform/environments/azure/${{ matrix.environment }}
        run: |
          infracost breakdown \
            --path . \
            --terraform-plan-file tfplan \
            --format table \
            --out-file /tmp/infracost-${{ matrix.environment }}.txt
          echo "cost=$(cat /tmp/infracost-${{ matrix.environment }}.txt)" >> $GITHUB_OUTPUT

      - name: Post Plan Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/azure/${{ matrix.environment }}/plan.txt', 'utf8');
            const cost = fs.readFileSync(`/tmp/infracost-${{ matrix.environment }}.txt`, 'utf8');
            const body = `## Terraform Plan: ${{ matrix.environment }}\n\`\`\`\n${plan.slice(0, 3000)}\n\`\`\`\n### Infracost (Azure)\n\`\`\`\n${cost}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });