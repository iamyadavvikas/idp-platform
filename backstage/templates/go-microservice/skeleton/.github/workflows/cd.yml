name: CD

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - "k8s/**"

env:
  REGISTRY: yourregistry.azurecr.io

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group dev-aks-rg \
            --name idp-dev \
            --overwrite-existing

      - name: Validate Kustomize Build
        run: |
          kustomize build helm/{{name}}

      - name: Deploy to Dev
        run: |
          kubectl apply -k helm/{{name}}

  deploy-stage:
    name: Deploy to Stage
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group stage-aks-rg \
            --name idp-stage \
            --overwrite-existing

      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/clusters/stage

      - name: Deploy to Stage
        run: |
          kubectl apply -k k8s/clusters/stage

  deploy-prod:
    name: Deploy to Prod
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group prod-aks-rg \
            --name idp-prod \
            --overwrite-existing

      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/clusters/prod

      - name: Deploy to Prod
        run: |
          kubectl apply -k k8s/clusters/prod