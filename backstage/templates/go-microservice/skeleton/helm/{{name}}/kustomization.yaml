apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - canary.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml

commonLabels:
  app: {{name}}
  platform: idp

images:
  - name: {{name}}
    newName: yourregistry.azurecr.io/{{name}}
    newTag: latest