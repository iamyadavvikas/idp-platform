apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{name}}
  namespace: {{name}}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: {{name}}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - {{name}}