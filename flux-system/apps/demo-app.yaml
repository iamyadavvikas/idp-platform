apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-app
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./k8s/clusters/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  timeout: 5m0s
  postBuild:
    substitute:
      ENVIRONMENT: dev
      CLUSTER: idp-dev