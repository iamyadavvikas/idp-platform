apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluxcd
  namespace: flux-system
spec:
  interval: 10m0s
  url: https://fluxcd.github.io/flux
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 10m0s
  chart:
    spec:
      chart: flux2
      version: "2.5.0"
      sourceRef:
        kind: HelmRepository
        name: fluxcd
        namespace: flux-system
      interval: 10m0s
  values:
    imageAutomation:
      enabled: true
    imageReflector:
      enabled: true
    imagePolicy:
      enabled: true