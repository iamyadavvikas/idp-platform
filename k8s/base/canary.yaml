apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: demo-app
  namespace: demo-app
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  progressDeadlineSeconds: 60
  service:
    port: 80
    targetPort: 8080
    portName: http
  analysis:
    interval: 30s
    threshold: 5
    maxWeight: 100
    stepWeight: 10
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 30s
        provider:
          prometheus:
            address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
            query: |
              sum(rate(http_requests_total{namespace="demo-app",status!~"5.."}[2m]))
              /
              sum(rate(http_requests_total{namespace="demo-app"}[2m])) * 100
      - name: request-error-rate
        thresholdRange:
          max: 0.05
        interval: 30s
        provider:
          prometheus:
            address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
            query: |
              max(http_requests_error_rate{namespace="demo-app"})
    webhooks:
      - name: "load-test"
        url: http://flagger-loadtester.demo-app/
        timeout: 5s
        metadata:
          type: "cmd"
          cmd: "hey -z 30s -q 10 -c 2 http://demo-app.demo-app/"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo-app
  annotations:
    azure.workload.identity/client-id: ""
