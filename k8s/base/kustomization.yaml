apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - canary.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml

commonLabels:
  app: demo-app
  platform: idp

images:
  - name: demo-app
    newName: yourregistry.azurecr.io/demo-app
    newTag: latest