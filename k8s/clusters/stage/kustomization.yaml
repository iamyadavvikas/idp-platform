apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-app

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: demo-app
        namespace: demo-app
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: demo-app

commonLabels:
  environment: stage